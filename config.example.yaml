server:
  host: "0.0.0.0"
  port: 8787
  # readAuth is none-only. Keep plain HTTP listeners private; never internet-expose usagent.
  readAuth:
    mode: "none"
  statePath: "%STATE%/usagent/snapshot.json"

client:
  # Leave url empty to use the local daemon derived from server.host/server.port.
  # Set an absolute HTTP(S) origin such as private Tailnet/MagicDNS "http://lattice:8788".
  # require-daemon fails closed and never refreshes providers locally.
  url: ""
  mode: "prefer-daemon" # prefer-daemon | require-daemon | local-only

providers:
  claudeOAuth:
    enabled: true
    credentialsPath: "~/.claude/.credentials.json"
    endpointUrl: "https://api.anthropic.com/api/oauth/usage"
    betaHeader: "oauth-2025-04-20"
    userAgent: "claude-code/2.0"
    refreshMs: 900000
    staleMs: 2700000
    # Optional non-secret helper metadata. Unknown/unconfigured providers omit tier/tags.
    # metadata:
    #   tier: "high"
    #   tags: ["subscription", "chat"]
    #   models:
    #     claude-code-oauth-session:
    #       tier: "high"
    #       tags: ["session"]

  chatgpt:
    # ChatGPT Plus/Pro subscription quota via Codex/ChatGPT OAuth auth.
    # Accepts Codex CLI ~/.codex/auth.json or Pi ~/.pi/agent/auth.json.
    enabled: false
    authPath: "~/.codex/auth.json"
    endpointUrl: "https://chatgpt.com/backend-api/wham/usage"
    resetCreditsEndpointUrl: "https://chatgpt.com/backend-api/wham/rate-limit-reset-credits"
    resetConsumeEndpointUrl: "https://chatgpt.com/backend-api/wham/rate-limit-reset-credits/consume"
    # Mutating API endpoint remains disabled unless explicitly enabled. Keep this false
    # on broadly reachable central listeners pending a later security design.
    allowResetConsume: false
    tokenEnv: "CHATGPT_ACCESS_TOKEN"
    accountIdEnv: "CHATGPT_ACCOUNT_ID"
    userAgent: "usagent/0.1"
    refreshMs: 300000
    staleMs: 900000

  openai:
    # OpenAI Platform/API cost budget, not ChatGPT Plus/Pro subscription usage.
    # Set enabled true only when OPENAI_ADMIN_KEY is available at runtime and you want API spend budgets.
    enabled: false
    baseUrl: "https://api.openai.com"
    # costsEndpoint can override baseUrl + /v1/organization/costs for local fakes/proxies.
    # costsEndpoint: "https://api.openai.com/v1/organization/costs"
    apiKeyEnv: "OPENAI_ADMIN_KEY"
    refreshMs: 600000
    staleMs: 1800000
    budgets:
      - id: "weekly-usd"
        unit: "usd"
        limit: 50
        window: { id: "week", label: "W", kind: "weekly" }
      - id: "monthly-usd"
        unit: "usd"
        limit: 200
        window: { id: "month", label: "M", kind: "monthly" }

  anthropic:
    # Anthropic Console/API prepaid credits, separate from Claude subscriptions.
    # Supported only for real Anthropic organizations with Admin API access;
    # personal/individual Console organizations are not supported.
    # See docs/ANTHROPIC_CREDITS.md to capture a matching balance/cost checkpoint.
    enabled: false
    apiKeyEnv: "ANTHROPIC_ADMIN_KEY"
    # Alternatively read a raw key file at refresh time (takes precedence over env):
    # apiKeyFile: "~/.config/usagent/anthropic-admin-key"
    refreshMs: 300000
    staleMs: 900000
    # No balance or spending baseline is assumed. All checkpoint fields are required
    # when enabled. Replace the placeholders with your own values before uncommenting.
    # checkpoint:
    #   balanceUSD: <balance at checkpoint>
    #   reportStart: "<UTC date>T00:00:00Z"
    #   reportedCostUSD: <total reported USD from reportStart at checkpoint>

  zAi:
    # Set enabled true only when ZAI_API_KEY or GLM_API_KEY is available at runtime.
    enabled: false
    endpointUrl: "https://api.z.ai/api/monitor/usage/quota/limit"
    tokenEnv: "ZAI_API_KEY"
    tokenEnvFallbacks: ["GLM_API_KEY"]
    authScheme: "bearer" # bearer | header | none
    authHeader: "Authorization"
    refreshMs: 300000
    staleMs: 900000
    # TIME_LIMIT/web-search quota is hidden by default.
    excludeLimitTypes: ["TIME_LIMIT"]

  cursor:
    # Cursor Models is a shared monthly pool for Cursor Grok 4.5 and Composer.
    # Reads Cursor's local login; alternatively set CURSOR_ACCESS_TOKEN at runtime.
    enabled: false
    authPath: "~/.config/cursor/auth.json"
    endpointUrl: "https://api2.cursor.sh/aiserver.v1.DashboardService/GetCurrentPeriodUsage"
    balanceEndpointUrl: "https://cursor.com/api/auth/stripe"
    tokenEnv: "CURSOR_ACCESS_TOKEN"
    refreshMs: 300000
    staleMs: 900000

  custom:
    - id: "my-provider"
      label: "Mine"
      enabled: false
      refreshMs: 300000
      staleMs: 900000
      # Optional non-secret helper metadata for custom providers and their item IDs.
      # metadata:
      #   tier: "medium"
      #   tags: ["custom"]
      endpoints:
        - id: "quota"
          url: "https://example.com/quota"
          method: "GET"
          headers:
            x-client: "usagent"
          auth:
            type: "bearer" # none | bearer | header
            tokenEnv: "MINE_TOKEN"
            headerName: "Authorization"
          itemsPath: "items"
          item:
            # String values are JSON dot paths by default. Use literal:<value> for constants.
            id: "id"
            label: "label"
            window:
              id: "window.id"
              label: "window.label"
              kind: "window.kind"
              resetAt: "resetAt"
              resetAtFormat: "unixMs" # unixMs | unixSeconds | rfc3339
            unit: "unit"
            limit: "limit"
            used: "used"
            remaining: "remaining"
            percentUsed: "percentUsed"
            visible: true

usageView:
  providers: ["claude-code", "chatgpt", "z-ai", "cursor"]
  windows: ["session", "weekly", "monthly", "fableWeekly", "extraCredits", "resetCredits"]
  percentMode: "remaining" # remaining | used
  labelStyle: "long" # long | short
  showResetMinutes: true
  show24hUsage: false
  hideUnavailable: true
  excludeWindows: ["web"]

quota:
  refreshMs: 300000
  providers:
    - id: "claude-code"
      label: "Claude"
      source: "pull"
      staleMs: 600000
      highlightedBucket: "fable"
      highlightedBucketLabel: "Fable"
